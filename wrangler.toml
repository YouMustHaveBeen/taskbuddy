name = "taskbuddy"
main = "src/index.ts"
compatibility_date = "2026-08-20"

[build]
command = "npm run build:web"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/tg/*"]

[[d1_databases]]
binding = "DB"
database_name = "taskbuddy"
database_id = "DATABASE_ID"
migrations_dir = "migrations"
