name = "taskbuddy"
main = "src/index.ts"
compatibility_date = "2026-08-20"

[build]
command = "npm run build:web"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/tg/*"]

[vars]
PUBLIC_URL = "https://taskbuddy.youmusthavebeen.workers.dev"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "taskbuddy"
database_id = "bb10ce79-5898-403d-8211-7ee00b0d5df9"
migrations_dir = "migrations"
