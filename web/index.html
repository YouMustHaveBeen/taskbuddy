<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskBuddy</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #1d5fae;
        --line: color-mix(in srgb, currentColor 18%, transparent);
        --soft: color-mix(in srgb, currentColor 6%, transparent);
        --danger: #b52f2f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        max-width: 720px;
        margin-inline: auto;
        font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      p { margin: 8px 0; }
      nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
      nav button { flex: 1 1 auto; }
      button {
        font: inherit;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--soft);
        color: inherit;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; margin-top: 1rem; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; }
      input:not([type="checkbox"]), select, textarea {
        font: inherit;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: transparent;
        color: inherit;
      }
      textarea { resize: vertical; }
      input[type="checkbox"] { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
      ul { list-style: none; margin: 0; padding: 0; }
      li { margin: 8px 0; }
      h2 { font-size: 18px; margin: 20px 0 8px; }
      section > ul > li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .add { width: 100%; font-size: 24px; background: var(--accent); border-color: var(--accent); color: #fff; margin-bottom: 8px; }
      .wide { margin-bottom: 8px; }
      .empty { opacity: 0.6; }
      .rows .row { display: block; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      .row-title { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 14px; }
      .card { padding: 4px 14px 14px; border-top: 1px solid var(--line); background: var(--soft); }
      .hint { opacity: 0.7; font-size: 14px; }
      .filters-box { margin: 12px 0; }
      .filters-box > summary { cursor: pointer; padding: 8px 0; }
      .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 12px; }
      .filters .field select { width: 100%; }
      .row-title .level { float: right; font-size: 13px; opacity: 0.7; margin-left: 8px; }
      .row-title .level-top, .row-title .level-high { opacity: 1; color: var(--accent); font-weight: 600; }
      .row-title .owner, .card .owner { font-size: 13px; opacity: 0.7; }
      .row-title .owner { display: block; }
      .block { margin: 16px 0; }
      .block h2 { font-size: 17px; margin: 0 0 8px; }
      .ring { margin: 8px auto 16px; text-align: center; }
      .ring figcaption { font-size: 14px; opacity: 0.7; }
      .slots { display: grid; gap: 8px; }
      .slot-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--soft); }
      .slot-name { display: block; font-size: 13px; opacity: 0.7; }
      .slot-task .meta, .today-row .meta { font-size: 13px; opacity: 0.7; margin-left: 8px; }
      .slot-card textarea { width: 100%; min-height: 72px; font: inherit; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .actions button { flex: 1; }
      .actions button.primary { width: auto; margin-top: 0; }
      .today-row > span { flex: 1; min-width: 0; }
      .today-row > span.actions { flex: 0 0 auto; margin-top: 0; }
      .timer-clock { font-size: 32px; font-variant-numeric: tabular-nums; margin: 8px 0; }
      .today-row > button { flex: none; }
      .rows .today-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; }
      .today-row .done { text-decoration: line-through; opacity: 0.6; }
      .peek { text-align: center; margin-bottom: 8px; }
      .peek-toggle { font-size: 20px; }
      .peek .block { text-align: left; }
      .peek-row { display: grid; gap: 4px; padding: 10px 14px; }
      .rows .reward-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; opacity: 0.85; }
      .rows .survey-row, .rows .insight-row { padding: 12px 14px; }
      .insight-row textarea { width: 100%; }
      .field { display: block; margin: 12px 0; }
      .field > span { display: block; font-size: 14px; opacity: 0.7; margin-bottom: 4px; }
      .marks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
      .check { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
      .spheres { border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; padding: 8px 12px; }
      .spheres label { display: inline-flex; align-items: center; gap: 8px; margin: 4px 14px 4px 0; }
      .danger-zone { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--line); }
      .danger { background: var(--danger); border-color: var(--danger); color: #fff; }
      [role="alert"] { color: var(--danger); }
      @media (prefers-color-scheme: dark) {
        [role="alert"] { color: #ff8a8a; }
        .row-title .level-top, .row-title .level-high { color: #8ab8ff; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
